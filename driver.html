<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaferGo — Driver Screen</title>
  <a href="rate-driver.html" class="hidden sm:inline-flex px-3 py-1.5 rounded-xl bg-yellow-100 hover:bg-yellow-200 text-slate-900 text-xs font-bold">Rate Driver</a>
<a href="profile.html" class="hidden sm:inline-flex px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">Profile</a>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    *:focus-visible { outline: 3px solid #f59e0b !important; outline-offset: 2px !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="saferGo.jpeg" alt="SaferGo"
          onerror="this.onerror=null; this.src='LOGO.jpeg';"
          class="w-9 h-9 rounded-xl object-cover border" />
        <div>
          <span class="font-heading font-extrabold text-lg">SaferGo</span>
          <span class="ml-2 text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800">Driver Screen</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-600"></i>
          <select id="d-city" onchange="changeDriverCity(this.value)" class="bg-transparent focus:outline-none cursor-pointer">
            <option value="islamabad">Islamabad</option>
            <option value="rawalpindi">Rawalpindi</option>
            <option value="lahore">Lahore</option>
            <option value="karachi">Karachi</option>
            <option value="peshawar">Peshawar</option>
            <option value="quetta">Quetta</option>
            <option value="multan">Multan</option>
            <option value="faisalabad">Faisalabad</option>
          </select>
        </div>
        <a href="login.html" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <span class="text-xs font-semibold text-slate-500">Captain Net Earnings (90%)</span>
        <div id="d-net" class="font-heading font-extrabold text-2xl text-emerald-700 mt-1">Rs 0</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <span class="text-xs font-semibold text-slate-500">10% Admin Commission</span>
        <div id="d-comm" class="font-heading font-extrabold text-2xl text-amber-600 mt-1">Rs 0</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <span class="text-xs font-semibold text-slate-500">Active City</span>
        <div id="d-city-display" class="font-heading font-extrabold text-2xl text-slate-900 mt-1">Islamabad</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-6">
      <h2 class="font-heading font-bold text-lg mb-4">Incoming Ride Request</h2>

      <div id="no-ride" class="p-8 text-center rounded-xl bg-slate-50 border border-dashed border-slate-200 text-sm text-slate-500">
        Abhi koi active ride request nahi hai. <strong>passenger.html</strong> se ride book karein.
      </div>

      <div id="ride-card" class="hidden space-y-4">
        <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
          <div class="flex justify-between items-center mb-2">
            <span id="r-city-tag" class="text-xs font-bold px-2.5 py-0.5 rounded bg-emerald-700 text-white">Islamabad</span>
            <span id="r-fare" class="font-heading font-extrabold text-xl text-emerald-800">Rs 380</span>
          </div>
          <p id="r-route" class="font-bold text-sm text-slate-900"></p>
          <p id="r-split" class="text-xs text-slate-600 mt-1"></p>
        </div>

        <!-- Raise Fare Controls (Shown when ride is in 'searching' / incoming state) -->
        <div id="raise-fare-panel" class="p-4 rounded-xl bg-amber-50/70 border border-amber-200 space-y-3">
          <div class="flex items-center justify-between">
            <label for="raise-fare-input" class="text-xs font-bold text-slate-800">Counter / Raised Fare (PKR)</label>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="bumpRaiseFare(30)" class="px-2.5 py-1 rounded-lg bg-white hover:bg-amber-100 border border-amber-300 text-xs font-bold text-slate-800">+Rs 30</button>
              <button type="button" onclick="bumpRaiseFare(50)" class="px-2.5 py-1 rounded-lg bg-white hover:bg-amber-100 border border-amber-300 text-xs font-bold text-slate-800">+Rs 50</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2.5">
            <input id="raise-fare-input" type="number" min="50" step="10"
              class="flex-1 px-3.5 py-2.5 rounded-xl border border-amber-300 bg-white font-heading font-bold text-sm text-slate-900" />
            <button type="button" onclick="applyRaiseFare()"
              class="px-5 py-2.5 rounded-xl bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-heading font-extrabold text-sm shadow-sm flex items-center justify-center gap-1.5 transition-colors">
              <i data-lucide="trending-up" class="w-4 h-4"></i>
              <span>Raise Fare</span>
            </button>
          </div>
          <p id="raise-fare-feedback" class="text-xs font-semibold text-amber-900 hidden"></p>
        </div>

        <div id="step-accept" class="flex gap-3">
          <button type="button" onclick="acceptRide()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm">Accept Ride</button>
          <button type="button" onclick="rejectRide()" class="px-5 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-sm">Reject</button>
        </div>

        <div id="step-complete" class="hidden">
          <button type="button" onclick="completeRide()" class="px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-heading font-bold text-sm">
            Complete Ride (90% Driver / 10% Admin)
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    const session = JSON.parse(localStorage.getItem('safergo_session') || '{"city":"islamabad"}');
    document.getElementById('d-city').value = session.city || 'islamabad';
    document.getElementById('d-city-display').textContent = document.getElementById('d-city').selectedOptions[0].text;

    let lastSyncedFare = null;

    function changeDriverCity(val) {
      session.city = val;
      localStorage.setItem('safergo_session', JSON.stringify(session));
      document.getElementById('d-city-display').textContent = document.getElementById('d-city').selectedOptions[0].text;
    }

    function bumpRaiseFare(addAmount) {
      const input = document.getElementById('raise-fare-input');
      const current = parseInt(input.value, 10) || 200;
      input.value = current + addAmount;
    }

    function applyRaiseFare() {
      const raw = localStorage.getItem('safergo_active_ride');
      if (!raw) return;

      const r = JSON.parse(raw);
      const raised = parseInt(document.getElementById('raise-fare-input').value, 10);
      if (!raised || raised <= r.fare) {
        const fb = document.getElementById('raise-fare-feedback');
        fb.textContent = `Naya fare mojooda fare (Rs ${r.fare}) se zyada hona chahiye.`;
        fb.classList.remove('hidden');
        return;
      }

      r.pendingFare = raised;
      r.priceChangeStatus = 'pending';
      localStorage.setItem('safergo_active_ride', JSON.stringify(r));
      lastSyncedFare = raised;

      const fb = document.getElementById('raise-fare-feedback');
      fb.textContent = `Passenger ko Rs ${raised} ki price change request bhej di gayi hai! (Waiting for Passenger approval)`;
      fb.classList.remove('hidden');
      refreshDriver(true);
    }

    function acceptRide() {
      const raw = localStorage.getItem('safergo_active_ride');
      if (!raw) return;
      const r = JSON.parse(raw);
      r.status = 'accepted';
      localStorage.setItem('safergo_active_ride', JSON.stringify(r));
      refreshDriver();
    }

    function rejectRide() {
      localStorage.removeItem('safergo_active_ride');
      refreshDriver();
    }

    function completeRide() {
      const raw = localStorage.getItem('safergo_active_ride');
      if (!raw) return;
      const r = JSON.parse(raw);
      const rides = JSON.parse(localStorage.getItem('safergo_rides') || '[]');
      rides.unshift({
        id: r.id || ('RD-' + Math.floor(9000 + Math.random() * 1000)),
        city: r.city,
        route: `${r.pickup} → ${r.dropoff}`,
        fare: r.fare,
        date: new Date().toLocaleTimeString()
      });
      localStorage.setItem('safergo_rides', JSON.stringify(rides));
      localStorage.removeItem('safergo_active_ride');
      refreshDriver();
    }

    function refreshDriver(skipInputSync = false) {
      const rides = JSON.parse(localStorage.getItem('safergo_rides') || '[]');
      const gross = rides.reduce((s, r) => s + Number(r.fare || 0), 0);
      const comm = Math.round(gross * 0.10);
      const net = gross - comm;
      document.getElementById('d-net').textContent = `Rs ${net.toLocaleString()}`;
      document.getElementById('d-comm').textContent = `Rs ${comm.toLocaleString()}`;

      const raw = localStorage.getItem('safergo_active_ride');
      const noRide = document.getElementById('no-ride');
      const card = document.getElementById('ride-card');
      if (!raw) {
        noRide.classList.remove('hidden');
        card.classList.add('hidden');
        lastSyncedFare = null;
        return;
      }

      const r = JSON.parse(raw);
      noRide.classList.add('hidden');
      card.classList.remove('hidden');

      const displayFare = (r.priceChangeStatus === 'pending' && r.pendingFare) ? r.pendingFare : r.fare;
      const rComm = Math.round(displayFare * 0.10);
      const rNet = displayFare - rComm;

      document.getElementById('r-city-tag').textContent = r.city;
      document.getElementById('r-fare').textContent =
        (r.priceChangeStatus === 'pending' && r.pendingFare)
          ? `Rs ${r.fare} → Rs ${r.pendingFare} (Pending)`
          : `Rs ${r.fare}`;
      document.getElementById('r-route').textContent = `${r.pickup} → ${r.dropoff} (${r.payment})`;
      document.getElementById('r-split').textContent = `Your Net (90%): Rs ${rNet} • Admin Commission (10%): Rs ${rComm}`;

      const fb = document.getElementById('raise-fare-feedback');
      if (r.priceChangeStatus === 'accepted') {
        fb.textContent = `Passenger ne naya fare Rs ${r.fare} accept kar liya hai!`;
        fb.classList.remove('hidden');
      } else if (r.priceChangeStatus === 'declined') {
        fb.textContent = `Passenger ne naya fare decline kar diya (Fare: Rs ${r.fare}).`;
        fb.classList.remove('hidden');
      }

      const raisePanel = document.getElementById('raise-fare-panel');
      const isSearching = r.status === 'searching';
      raisePanel.classList.toggle('hidden', !isSearching);

      const input = document.getElementById('raise-fare-input');
      if (!skipInputSync && lastSyncedFare !== displayFare && document.activeElement !== input) {
        input.value = displayFare + 30;
        lastSyncedFare = displayFare;
      }

      document.getElementById('step-accept').classList.toggle('hidden', !isSearching);
      document.getElementById('step-complete').classList.toggle('hidden', isSearching);
    }

    refreshDriver();
    setInterval(() => refreshDriver(false), 1500);
  </script>
</body>
</html>
