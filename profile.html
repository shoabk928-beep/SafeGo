<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaferGo — My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    *:focus-visible { outline: 3px solid #f59e0b !important; outline-offset: 2px !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="saferGo.jpeg" alt="SaferGo"
          onerror="this.onerror=null; this.src='LOGO.jpeg';"
          class="w-9 h-9 rounded-xl object-cover border" />
        <div>
          <span class="font-heading font-extrabold text-lg">SaferGo</span>
          <span class="ml-2 text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Profile</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a id="back-portal-link" href="passenger.html" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">
          Back to Screen
        </a>
        <a href="login.html" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Logout</a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 grid grid-cols-1 md:grid-cols-12 gap-6">

    <!-- Left Profile Summary Card -->
    <div class="md:col-span-4 bg-white rounded-3xl border border-slate-200 p-6 shadow-sm text-center flex flex-col items-center justify-between">
      <div class="w-full flex flex-col items-center">
        <div id="avatar-circle" class="w-20 h-20 rounded-3xl bg-emerald-600 text-white font-heading font-extrabold text-2xl flex items-center justify-center shadow-lg mb-3">
          UT
        </div>
        <h1 class="font-heading font-extrabold text-xl text-slate-900" id="summary-name">Usman Tariq</h1>
        <span id="summary-role" class="mt-1 inline-block text-xs font-bold uppercase px-3 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
          Passenger
        </span>
        <p class="text-xs text-slate-500 mt-2 font-mono" id="summary-phone">0300-0000000</p>
        <p class="text-xs font-semibold text-emerald-700 mt-1" id="summary-city">City: Islamabad</p>
      </div>

      <div class="w-full pt-5 mt-5 border-t border-slate-100 grid grid-cols-2 gap-2 text-center">
        <div class="p-2.5 rounded-xl bg-slate-50">
          <span class="text-[11px] text-slate-400 block">Completed Rides</span>
          <strong class="font-heading font-bold text-base text-slate-900" id="stat-rides">3</strong>
        </div>
        <div class="p-2.5 rounded-xl bg-slate-50">
          <span class="text-[11px] text-slate-400 block">Driver Rating</span>
          <strong class="font-heading font-bold text-base text-amber-500" id="stat-rating">★ 4.9</strong>
        </div>
      </div>
    </div>

    <!-- Right Edit Profile Form -->
    <div class="md:col-span-8 bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
      <h2 class="font-heading font-bold text-lg text-slate-900 mb-1">Profile Settings</h2>
      <p class="text-xs text-slate-500 mb-5">Apni profile details aur default city update karein.</p>

      <form onsubmit="saveProfile(event)" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="prof-name" class="block text-xs font-bold uppercase text-slate-600 mb-1">Full Name</label>
            <input id="prof-name" type="text" required
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900" />
          </div>

          <div>
            <label for="prof-phone" class="block text-xs font-bold uppercase text-slate-600 mb-1">Mobile Number (0300-0000000)</label>
            <input id="prof-phone" type="tel" required inputmode="numeric" maxlength="12"
              pattern="^03[0-9]{2}-[0-9]{7}$"
              oninput="formatPakPhone(this)"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 font-mono" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="prof-city" class="block text-xs font-bold uppercase text-slate-600 mb-1">Default City</label>
            <select id="prof-city" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold text-slate-900 bg-white">
              <option value="islamabad">Islamabad</option>
              <option value="rawalpindi">Rawalpindi</option>
              <option value="lahore">Lahore</option>
              <option value="karachi">Karachi</option>
              <option value="peshawar">Peshawar</option>
              <option value="quetta">Quetta</option>
              <option value="multan">Multan</option>
              <option value="faisalabad">Faisalabad</option>
            </select>
          </div>

          <div>
            <label for="prof-vehicle" class="block text-xs font-bold uppercase text-slate-600 mb-1">Vehicle / Preference</label>
            <input id="prof-vehicle" type="text" placeholder="e.g. Suzuki Alto / AC Comfort"
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900" />
          </div>
        </div>

        <div class="pt-2 flex items-center justify-between gap-3">
          <span id="prof-saved-msg" class="text-xs font-bold text-emerald-700 hidden">✓ Profile save ho gayi hai!</span>
          <button type="submit" class="ml-auto px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-heading font-bold text-sm shadow">
            Save Changes
          </button>
        </div>
      </form>
    </div>

  </main>

  <script>
    lucide.createIcons();

    const CITY_NAMES = {
      islamabad: 'Islamabad', rawalpindi: 'Rawalpindi', lahore: 'Lahore', karachi: 'Karachi',
      peshawar: 'Peshawar', quetta: 'Quetta', multan: 'Multan', faisalabad: 'Faisalabad'
    };

    function formatPakPhone(input) {
      let digits = input.value.replace(/\D/g, '').slice(0, 11);
      input.value = digits.length > 4 ? `${digits.slice(0, 4)}-${digits.slice(4)}` : digits;
    }

    function loadProfile() {
      const session = JSON.parse(localStorage.getItem('safergo_session') || '{"role":"passenger","name":"Usman Tariq","phone":"0300-0000000","city":"islamabad","vehicle":"Mini Car"}');
      const rides = JSON.parse(localStorage.getItem('safergo_rides') || '[]');
      const ratings = JSON.parse(localStorage.getItem('safergo_driver_ratings') || '[]');

      document.getElementById('prof-name').value = session.name || 'Usman Tariq';
      document.getElementById('prof-phone').value = session.phone || '0300-0000000';
      document.getElementById('prof-city').value = session.city || 'islamabad';
      document.getElementById('prof-vehicle').value = session.vehicle || 'Mini Car';

      const backLink = document.getElementById('back-portal-link');
      if (session.role === 'driver') { backLink.href = 'driver.html'; backLink.textContent = 'Driver Screen'; }
      else if (session.role === 'admin') { backLink.href = 'admin.html'; backLink.textContent = 'Admin Screen'; }
      else { backLink.href = 'passenger.html'; backLink.textContent = 'Passenger Screen'; }

      document.getElementById('stat-rides').textContent = rides.length;
      if (ratings.length > 0) {
        const avg = (ratings.reduce((s, x) => s + x.stars, 0) / ratings.length).toFixed(1);
        document.getElementById('stat-rating').textContent = `★ ${avg}`;
      }

      updateSummaryUI(session);
    }

    function updateSummaryUI(session) {
      const name = session.name || 'Usman Tariq';
      document.getElementById('avatar-circle').textContent = name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('summary-name').textContent = name;
      document.getElementById('summary-role').textContent = session.role || 'passenger';
      document.getElementById('summary-phone').textContent = session.phone || '0300-0000000';
      document.getElementById('summary-city').textContent = `City: ${CITY_NAMES[session.city] || 'Islamabad'}`;
    }

    function saveProfile(e) {
      e.preventDefault();
      const phoneInput = document.getElementById('prof-phone');
      formatPakPhone(phoneInput);
      if (!/^03[0-9]{2}-[0-9]{7}$/.test(phoneInput.value.trim())) {
        alert('Mobile number format 0300-0000000 hona chahiye.');
        return;
      }

      const session = JSON.parse(localStorage.getItem('safergo_session') || '{"role":"passenger"}');
      session.name = document.getElementById('prof-name').value.trim();
      session.phone = phoneInput.value.trim();
      session.city = document.getElementById('prof-city').value;
      session.vehicle = document.getElementById('prof-vehicle').value.trim();

      localStorage.setItem('safergo_session', JSON.stringify(session));
      updateSummaryUI(session);

      const msg = document.getElementById('prof-saved-msg');
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 3000);
    }

    loadProfile();
  </script>
</body>
</html>
