<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaferGo — Admin Screen (10% Commission)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="saferGo.jpeg" alt="SaferGo"
          onerror="this.onerror=null; this.src='LOGO.jpeg';"
          class="w-9 h-9 rounded-xl object-cover border" />
        <div>
          <span class="font-heading font-extrabold text-lg">SaferGo</span>
          <span class="ml-2 text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-900 text-white">Admin Screen • 10% Commission</span>
        </div>
      </div>
      <a href="login.html" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Logout</a>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <span class="text-xs font-semibold text-slate-500">Gross Ride Volume (100%)</span>
        <div id="a-gross" class="font-heading font-extrabold text-2xl text-slate-900 mt-1">Rs 0</div>
      </div>
      <div class="bg-emerald-50 rounded-2xl border-2 border-emerald-500 p-5">
        <span class="text-xs font-bold uppercase text-emerald-800">Admin Commission (10%)</span>
        <div id="a-comm" class="font-heading font-extrabold text-2xl text-emerald-700 mt-1">Rs 0</div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <span class="text-xs font-semibold text-slate-500">Driver Payouts (90%)</span>
        <div id="a-driver" class="font-heading font-extrabold text-2xl text-slate-900 mt-1">Rs 0</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-200">
        <h2 class="font-heading font-bold text-lg">Rides & 10% Commission Ledger</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 uppercase text-slate-500">
              <th class="py-3 px-5">Ride ID</th>
              <th class="py-3 px-4">City</th>
              <th class="py-3 px-4">Route</th>
              <th class="py-3 px-4">Total Fare</th>
              <th class="py-3 px-4">Driver (90%)</th>
              <th class="py-3 px-5 text-emerald-700">Admin (10%)</th>
            </tr>
          </thead>
          <tbody id="rides-tbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function renderAdmin() {
      const rides = JSON.parse(localStorage.getItem('safergo_rides') || '[]');
      const gross = rides.reduce((s, r) => s + Number(r.fare || 0), 0);
      const comm = Math.round(gross * 0.10);
      const driverPay = gross - comm;

      document.getElementById('a-gross').textContent = `Rs ${gross.toLocaleString()}`;
      document.getElementById('a-comm').textContent = `Rs ${comm.toLocaleString()}`;
      document.getElementById('a-driver').textContent = `Rs ${driverPay.toLocaleString()}`;

      document.getElementById('rides-tbody').innerHTML = rides.map(r => {
        const c = Math.round(r.fare * 0.10);
        const d = r.fare - c;
        return `
          <tr>
            <td class="py-3 px-5 font-mono font-bold">${r.id}</td>
            <td class="py-3 px-4 font-bold">${r.city}</td>
            <td class="py-3 px-4">${r.route}</td>
            <td class="py-3 px-4 font-bold">Rs ${r.fare}</td>
            <td class="py-3 px-4">Rs ${d}</td>
            <td class="py-3 px-5 font-extrabold text-emerald-700">+ Rs ${c}</td>
          </tr>
        `;
      }).join('');
    }

    renderAdmin();
    setInterval(renderAdmin, 1500);
  </script>
</body>
</html>
